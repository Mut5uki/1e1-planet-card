name = "planet-cards"
main = "cf-worker/index.js"
compatibility_date = "2025-03-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[assets]
directory = "."
binding = "ASSETS"
# WebSocket 必须先走 Worker，再回落到静态资源
run_worker_first = ["/ws*", "/health"]
