<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>七星牌</title>
  <link rel="stylesheet" href="styles.css?v=194" />
  <!-- 首屏关键字形尽早拉 -->
  <link rel="preload" as="image" href="assets/official/numbers/1e1.png?v36" />
  <link rel="preload" as="image" href="assets/official/ui/planet.png?v36" />
  <link rel="preload" as="image" href="assets/official/ui/card.png?v36" />
</head>
<body>
  <div id="boot" class="boot" aria-busy="true" aria-live="polite">
    <div class="boot-bar" aria-hidden="true">
      <div class="boot-bar-fill" id="boot-fill"></div>
    </div>
  </div>
  <div id="app" hidden>
    <!-- 主界面：同 12×9 网格 -->
    <section id="menu" class="menu" aria-label="menu">
      <div id="menu-board" class="board-12x9 menu-board" aria-label="menu board"></div>
    </section>

    <!-- 双人准备房间：同 12×9 网格 -->
    <section id="room" class="room" hidden aria-label="pair room">
      <div id="room-board" class="board-12x9 room-board" aria-label="room board"></div>
    </section>

    <!-- 设置：同 12×9 网格 -->
    <section id="settings" class="settings" hidden aria-label="settings">
      <div id="settings-board" class="board-12x9 settings-board" aria-label="settings board"></div>
    </section>

    <!-- 对局 -->
    <section id="game" class="game" hidden>
      <div id="board" class="board-12x9" aria-label="board"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="dialog">
          <div class="dialog-title" id="overlay-title"></div>
          <div class="dialog-body" id="overlay-body"></div>
          <button type="button" id="btn-overlay-ok" class="cell" aria-label="restart"></button>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="main.js?v=161"></script>
</body>
</html>
