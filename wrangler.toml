# Cloudflare Pages → https://planet-cards-web.pages.dev
# （workers.dev 在部分网络会被 DNS 污染打不开）
name = "planet-cards-web"
compatibility_date = "2025-03-01"
pages_build_output_dir = "."

# 复用 Worker planet-cards 里的 GameRoom（先 npm run deploy:worker）
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"
script_name = "planet-cards"
